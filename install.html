<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Querido Hub</title>
  <meta name="theme-color" content="#358888">
  <link rel="icon" type="image/png" sizes="180x180" href="/icons/querido-hub-oficial-v2-180.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/querido-hub-oficial-v2-180.png">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f5f5f5;color:#111}
    body{display:grid;place-items:center;min-height:100vh;padding:24px}
    main{width:min(430px,100%);background:#fff;border-radius:24px;padding:34px 28px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.08)}
    img{width:128px;height:128px;border-radius:24px;display:block;margin:0 auto 18px}
    h1{margin:0 0 14px;font-size:30px}
    p{margin:8px 0;color:#555;line-height:1.45}
    strong{color:#111}
  </style>
  <script>
    (function(){
      var key='querido-hub-safari-bookmark-v1';
      if (localStorage.getItem(key)==='ready') {
        window.location.replace("https://script.google.com/a/macros/conspira.com.br/s/AKfycbzEQ1GYz3dJAiIYUmfpp3pjLnEb3lfPVF0Yj6L8WsF7AnOiI5X1msK9pyJvo75R94kf/exec");
        return;
      }
      localStorage.setItem(key,'ready');
    })();
  </script>
</head>
<body>
  <main>
    <img src="/icons/querido-hub-oficial-v2-180.png" alt="Querido Hub">
    <h1>Querido Hub</h1>
    <p>Use <strong>Compartilhar → Adicionar à Tela de Início</strong>.</p>
    <p>Na tela seguinte, <strong>desative “Abrir como app web”</strong> antes de adicionar.</p>
  </main>
</body>
</html>
