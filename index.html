<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Querido Hub</title>
  <meta name="theme-color" content="#358888">

  <link rel="icon" type="image/png" sizes="180x180" href="/icons/querido-hub-oficial-v2-180.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/querido-hub-oficial-v2-180.png">
  <link rel="manifest" href="/manifest.webmanifest">

  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);

      if (!isIOS && !isAndroid) {
        window.location.replace("https://script.google.com/a/macros/conspira.com.br/s/AKfycbzEQ1GYz3dJAiIYUmfpp3pjLnEb3lfPVF0Yj6L8WsF7AnOiI5X1msK9pyJvo75R94kf/exec");
      }
    })();
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f5f5f5;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0;
    }

    .guia {
      display: block;
      width: 100%;
      max-width: 700px;
      height: auto;
      margin: 0 auto;
    }
  </style>

  <script>
    window.addEventListener('DOMContentLoaded', function () {
      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);

      if (isIOS || isAndroid) {
        history.replaceState(null, '', '/go.html');
      }
    });
  </script>
</head>

<body>
  <img
    class="guia"
    src="/guia-querido-hub.png"
    alt="Querido Hub como APP"
  >
</body>
</html>
