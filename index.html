<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Querido Hub</title>
  <meta name="theme-color" content="#358888">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Querido Hub">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="180x180" href="/icons/querido-hub-180.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/querido-hub-180.png">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f5f5f5;color:#111}
    body{display:grid;place-items:center;min-height:100vh;padding:24px}
    main{width:min(420px,100%);background:#fff;border-radius:24px;padding:34px 28px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.08)}
    img{width:128px;height:128px;border-radius:24px;display:block;margin:0 auto 18px}
    h1{margin:0 0 8px;font-size:30px}p{margin:0 0 24px;color:#555;line-height:1.45}
    a{display:inline-block;background:#358888;color:#fff;text-decoration:none;font-weight:700;padding:14px 22px;border-radius:12px}
    small{display:block;margin-top:20px;color:#888}
  </style>
</head>
<body>
  <main>
    <img src="/icons/querido-hub-180.png" alt="Querido Hub">
    <h1>Querido Hub</h1>
    <p>Central de aplicativos Querido.</p>
    <a href="https://script.google.com/macros/s/AKfycbzEQ1GYz3dJAiIYUmfpp3pjLnEb3lfPVF0Yj6L8WsF7AnOiI5X1msK9pyJvo75R94kf/exec">Abrir Querido Hub</a>
    <small>No iPhone, use Compartilhar → Adicionar à Tela de Início.</small>
  </main>
  <script>
    (function(){
      var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      if (standalone) window.location.replace("https://script.google.com/macros/s/AKfycbzEQ1GYz3dJAiIYUmfpp3pjLnEb3lfPVF0Yj6L8WsF7AnOiI5X1msK9pyJvo75R94kf/exec");
    })();
  </script>
</body>
</html>
