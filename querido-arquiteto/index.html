<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#358888"/>
<meta name="apple-mobile-web-app-title" content="Querido Arquiteto"/>
<title>Querido Arquiteto</title>
<meta name="description" content="Acesse e instale o Querido Arquiteto no celular e no computador."/>
<link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png"/>
<link rel="apple-touch-icon" type="image/png" sizes="180x180" href="./icons/icon-180.png"/>
<link rel="manifest" href="./manifest.webmanifest"/>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#F8FAFA;color:#263B3A;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100dvh;display:grid;place-items:center;padding:22px 14px}
main{width:min(440px,100%);padding:27px 24px;border:1px solid #dce6e4;border-radius:20px;background:#fff;box-shadow:0 18px 40px #163c3b0b}
.logo{width:128px;height:128px;object-fit:contain;display:block;margin:0 auto 16px}
h1{margin:0 0 7px;font-size:24px;text-align:center;letter-spacing:-.55px}
.intro{text-align:center;font-size:13px;color:#72817e;margin:0 0 20px}
h2{margin:0 0 7px;font-size:14px;color:#247a78}
section{border-top:1px solid #e5eeec;padding:14px 0}section p{font-size:13px;line-height:1.6;margin:0}
</style>
<script>
(()=>{const installed=navigator.standalone===true||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
if(installed){location.replace('./go.html');return;}
history.replaceState(null,'','./go.html');})();
</script>
</head>
<body>
<main>
<img class="logo" src="./icons/icon-180.png" width="128" height="128" alt="Logo Querido Arquiteto"/>
<h1>Querido Arquiteto</h1>
<p class="intro">Editor de plantas e maquetes</p>
<section><h2>iPhone</h2><p>No Safari: <strong>Compartilhar → Adicionar à Tela de Início</strong>. Desative <strong>Abrir como app web</strong>, quando disponível.</p></section>
<section><h2>Android / Chrome</h2><p>No Chrome: <strong>⋮ → Adicionar à tela inicial</strong> ou <strong>Criar atalho</strong>.</p></section>
</main>
</body>
</html>
